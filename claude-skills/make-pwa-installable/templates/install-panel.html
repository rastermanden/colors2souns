<!-- Drop this just under the page header. -->
<aside class="install-panel" id="installPanel" hidden>
  <img src="./icons/icon-192.png" alt="" class="install-icon" />
  <div class="install-text">
    <strong>Install {{SHORT_NAME}}</strong>
    <span id="installHint">Add it to your home screen for one-tap access.</span>
  </div>
  <div class="install-actions">
    <button id="installBtn" class="primary" type="button">Install</button>
    <button id="installClose" type="button" class="icon-btn" aria-label="Dismiss">✕</button>
  </div>
</aside>

<div class="modal" id="iosHelp" hidden>
  <div class="modal-card">
    <h3>Add to Home Screen</h3>
    <ol>
      <li>Tap the <strong>Share</strong> button in Safari's toolbar.</li>
      <li>Scroll and choose <strong>Add to Home Screen</strong>.</li>
      <li>Tap <strong>Add</strong> to confirm.</li>
    </ol>
    <button id="iosHelpClose" class="primary" type="button">Got it</button>
  </div>
</div>
