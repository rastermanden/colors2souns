name: Ensure PR has release label

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  ensure-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const releaseLabels = ['major', 'minor', 'patch', 'no-release'];
            const current = context.payload.pull_request.labels.map(l => l.name);
            if (current.some(n => releaseLabels.includes(n))) {
              core.info(`PR already has a release label: ${current.join(', ')}`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['patch'],
            });
            core.info('No release label found — applied `patch` as safety default.');
