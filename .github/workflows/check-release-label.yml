name: Check release label vs changed files

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- release-label-check -->';
            const APP_PATTERNS = [
              /^app\.js$/,
              /^index\.html$/,
              /^style\.css$/,
              /^sw\.js$/,
              /^manifest\.webmanifest$/,
              /^icons\//,
              /^samples\//,
            ];

            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            const hasNoRelease = labels.includes('no-release');

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map(f => f.filename);
            const appChanged = changed.filter(f => APP_PATTERNS.some(p => p.test(f)));
            const hasAppChanges = appChanged.length > 0;

            let body = null;
            if (hasNoRelease && hasAppChanges) {
              body = `${MARKER}\n` +
                `⚠️ **Label mismatch:** this PR is labeled \`no-release\` but changes app files:\n\n` +
                appChanged.map(f => `- \`${f}\``).join('\n') +
                `\n\nRemove \`no-release\` and apply \`patch\`, \`minor\`, or \`major\` so the merge produces a tag.`;
            } else if (!hasNoRelease && !hasAppChanges && changed.length > 0) {
              body = `${MARKER}\n` +
                `ℹ️ **Heads-up:** no app files changed in this PR. Consider applying the \`no-release\` label to skip the auto-tag on merge.\n\n` +
                `Changed files:\n` +
                changed.slice(0, 20).map(f => `- \`${f}\``).join('\n') +
                (changed.length > 20 ? `\n- …and ${changed.length - 20} more` : '');
            }

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.startsWith(MARKER));

            if (!body) {
              if (prior) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: prior.id,
                });
                core.info('Removed stale label-check comment — label and files now match.');
              } else {
                core.info('Label matches changed files. Nothing to do.');
              }
              return;
            }

            if (prior) {
              if (prior.body === body) {
                core.info('Comment already up to date.');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
              core.info('Updated existing label-check comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
              core.info('Posted new label-check comment.');
            }
